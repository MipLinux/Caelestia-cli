name: Auto Assign

# 沿用 MipLinux 的分配约定：issue / PR 创建后自动分给维护者，
# 让「谁受理」在列表页就能看见，不依赖评论区口头认领。

on:
  issues:
    types: [opened]
  pull_request:
    # reopened / synchronize 也触发：重开或补提交时补上分配，
    # 也让改了 workflow 之后能通过新事件（而非 Re-run）拿到新版本文件。
    types: [opened, reopened, synchronize]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: 'Auto-assign issue or PR'
        # 必须钉具体版本：该仓库同时存在同名 branch 和 tag 的 v1，
        # 而 tag 优先级更高，@v1 会被解析到远古版本：
        # 它只认 repo-token/assignees，且只读 context.payload.issue，
        # 于是在 pull_request 事件下报 "Couldn't find issue info in current context"。
        # v4.0.1 才同时支持 issues 与 pull_request 上下文。
        uses: pozil/auto-assign-issue@v4.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: LaT-SKY
